<!DOCTYPE html>
<html>
<head>
    <title>Criar Usuários Firebase</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <meta name="theme-color" content="#0ea5e9">
    <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
    <h2>Criando Usuários Firebase</h2>
    <div id="status"></div>
    
    <script>
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyACjKi3thEvR4NJryXLWeXhA5Lpwc8f9cA",
            authDomain: "painelinfomaq.firebaseapp.com",
            databaseURL: "https://painelinfomaq-default-rtdb.firebaseio.com",
            projectId: "painelinfomaq",
            storageBucket: "painelinfomaq.firebasestorage.app",
            messagingSenderId: "79791250650",
            appId: "1:79791250650:web:9f0b0efeaaaf0e28a3d9e3"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // Usuários para criar
        const usuarios = [
            {
                email: "leandroadm@wmoldes.com",
                password: "wmoldes",
                nome: "Administrador",
                role: "admin"
            },
            {
                email: "lideranca@wmoldes.com",
                password: "lider2026",
                nome: "Liderança",
                role: "lideranca"
            },
            {
                email: "carregador@wmoldes.com",
                password: "Caregador2026",
                nome: "Abastecedor",
                role: "carregador"
            }
        ];

        // Elemento para mostrar status
        const statusDiv = document.getElementById('status');

        // Função para atualizar status
        function atualizarStatus(mensagem, tipo = 'info') {
            const p = document.createElement('p');
            p.textContent = mensagem;
            p.style.color = tipo === 'success' ? 'green' : 
                           tipo === 'error' ? 'red' : 'blue';
            statusDiv.appendChild(p);
            console.log(mensagem);
        }

        function normalizeRoleLocal(role) {
            const value = String(role || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
            if (value === 'admin' || value === 'administrador') return 'admin';
            if (value === 'lideranca' || value === 'lider') return 'lideranca';
            if (value === 'carregador' || value === 'abastecedor' || value === 'operador') return 'carregador';
            return value || 'carregador';
        }

        function aguardarSessaoAdmin() {
            return new Promise((resolve, reject) => {
                const unsubscribe = auth.onAuthStateChanged(resolve, reject);
                setTimeout(() => {
                    unsubscribe();
                    resolve(auth.currentUser || null);
                }, 4000);
            });
        }

        async function validarAdminAtual() {
            const adminUser = await aguardarSessaoAdmin();
            if (!adminUser) throw new Error('Faça login como administrador antes de executar este criador.');

            const snap = await db.ref(`users/${adminUser.uid}`).once('value');
            const data = snap.val();
            const ativo = data && data.isActive !== false && data.ativo !== false;
            const role = normalizeRoleLocal(data && data.role);
            if (!ativo || role !== 'admin') throw new Error('A sessão atual não é de administrador ativo.');
            return adminUser;
        }

        // Função principal
        async function criarUsuarios() {
            atualizarStatus('🚀 Iniciando criação de usuários...');
            
            try {
                const adminUser = await validarAdminAtual();

                for (let i = 0; i < usuarios.length; i++) {
                    const usuario = {
                        ...usuarios[i],
                        email: String(usuarios[i].email || '').trim().toLowerCase(),
                        role: normalizeRoleLocal(usuarios[i].role)
                    };
                    atualizarStatus(`📝 Criando: ${usuario.email}...`);

                    let secondaryApp = null;
                    let createdUser = null;
                    let databaseSaved = false;
                    try {
                        secondaryApp = firebase.initializeApp(firebaseConfig, `seed-user-${Date.now()}-${i}`);
                        const secondaryAuth = secondaryApp.auth();

                        // Criar usuário no Auth sem trocar a sessão do administrador principal.
                        const userCredential = await secondaryAuth.createUserWithEmailAndPassword(
                            usuario.email,
                            usuario.password
                        );
                        createdUser = userCredential.user;
                        const userId = createdUser.uid;
                        if (typeof createdUser.updateProfile === 'function') {
                            await createdUser.updateProfile({ displayName: usuario.nome });
                        }
                        atualizarStatus(`✅ Auth criado: ${usuario.email}`, 'success');
                        
                        // Salvar dados no Database com a sessão administrativa principal.
                        const now = Date.now();
                        const userData = {
                            uid: userId,
                            email: usuario.email,
                            nome: usuario.nome,
                            name: usuario.nome,
                            role: usuario.role,
                            criadoEm: now,
                            createdAt: now,
                            atualizadoEm: now,
                            updatedAt: now,
                            criadoPor: adminUser.email || adminUser.uid,
                            createdBy: adminUser.email || adminUser.uid,
                            ativo: true,
                            isActive: true,
                            origem: 'criar-usuarios.html',
                            lastLogin: null
                        };
                        
                        await db.ref(`users/${userId}`).set(userData);
                        databaseSaved = true;
                        atualizarStatus(`✅ Database atualizado: ${usuario.email}`, 'success');
                        await secondaryAuth.signOut();
                    } catch (error) {
                        if (createdUser && !databaseSaved) {
                            try { await createdUser.delete(); } catch (_) {}
                        }
                        throw error;
                    } finally {
                        if (secondaryApp) {
                            try { await secondaryApp.delete(); } catch (_) {}
                        }
                    }
                    
                    // Aguardar 1 segundo
                    await new Promise(resolve => setTimeout(resolve, 1000));
                }
                
                atualizarStatus('🎉 TODOS OS USUÁRIOS CRIADOS COM SUCESSO!', 'success');
                atualizarStatus('=========================================', 'info');
                atualizarStatus('1. leandroadm@wmoldes.com (wmoldes)', 'info');
                atualizarStatus('2. lideranca@wmoldes.com (lider2026)', 'info');
                atualizarStatus('3. carregador@wmoldes.com (Caregador2026)', 'info');
                
            } catch (error) {
                atualizarStatus(`❌ ERRO: ${error.message}`, 'error');
                
                if (error.code === 'auth/email-already-in-use') {
                    atualizarStatus('⚠️ Este email já está cadastrado', 'error');
                } else if (error.code === 'auth/invalid-email') {
                    atualizarStatus('⚠️ Email inválido', 'error');
                } else if (error.code === 'auth/weak-password') {
                    atualizarStatus('⚠️ Senha muito fraca (mínimo 6 caracteres)', 'error');
                } else if (String(error.code || '').toLowerCase().includes('permission')) {
                    atualizarStatus('⚠️ Sem permissão para gravar users/{uid}. Entre como administrador.', 'error');
                }
            }
        }

        // Executar quando a página carregar
        window.onload = function() {
            atualizarStatus('⚠️ ANTES DE EXECUTAR:', 'info');
            atualizarStatus('1. Vá no Firebase Console', 'info');
            atualizarStatus('2. Authentication > Sign-in method', 'info');
            atualizarStatus('3. Habilite "Email/Password"', 'info');
            atualizarStatus('4. Faça login como administrador nesta mesma origem/domínio antes de executar', 'info');
            atualizarStatus('5. Clique no botão abaixo:', 'info');
            
            const button = document.createElement('button');
            button.textContent = '👉 CLIQUE AQUI PARA CRIAR USUÁRIOS 👈';
            button.style.padding = '15px';
            button.style.fontSize = '16px';
            button.style.margin = '20px 0';
            button.style.backgroundColor = '#4CAF50';
            button.style.color = 'white';
            button.style.border = 'none';
            button.style.borderRadius = '5px';
            
            button.onclick = criarUsuarios;
            
            statusDiv.appendChild(button);
        }
    </script>
    <script src="pwa-register.js"></script>
</body>
</html>
